name = "qrr-app"
main = "src/server.tsx"
compatibility_date = "2024-04-06"
compatibility_flags = ["nodejs_compat"]
assets = { directory = "./dist", binding = "ASSETS" }

[observability]
enabled = true

[[durable_objects.bindings]]
name = "DO"
class_name = "QrrAppDO"

[[migrations]]
tag = "v1" # Should be unique for each entry
new_sqlite_classes = ["QrrAppDO"]
